<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;color:#f4fffd;font:400 14px 'Golos Text',sans-serif;position:relative;
 background:radial-gradient(120% 80% at 20% 10%,#13b5a6 0,#0a6b66 45%,#06201f 100%)}
.top{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;font-size:12px;opacity:.85}
.dots{position:absolute;top:50px;left:20px;display:flex;gap:6px}
.dots i{width:22px;height:3px;background:#fff5;border-radius:2px}.dots i.on{background:#fff}
.mid{position:absolute;left:20px;bottom:230px}
.mid small{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.mid h1{font:700 44px/1.05 'Unbounded';margin-top:6px}
.mid b{display:block;font:400 56px/1.1 'Unbounded';letter-spacing:-.03em;margin-top:20px;font-variant-numeric:tabular-nums}
.mid b span{font-size:26px;opacity:.7}
.meta{position:absolute;left:20px;bottom:150px;font-size:14px;opacity:.9}
.meta u{text-decoration:none;background:#00000033;padding:4px 10px;border-radius:99px;margin-right:6px}
.rail{position:absolute;right:14px;bottom:150px;display:flex;flex-direction:column;gap:18px;align-items:center;font-size:11px}
.rail div{width:48px;height:48px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-size:22px}
.rail div:first-child{background:#fff;color:#06201f;font-weight:600}
.rail span{display:block;text-align:center;margin-top:3px}
.next{position:absolute;left:0;right:0;bottom:78px;height:46px;background:#06201f;border-radius:20px 20px 0 0;padding:12px 20px;font-size:13px;display:flex;justify-content:space-between;color:#8cc9c3}
.next i{font-style:normal;color:#e4572e}
.nav{position:absolute;bottom:0;left:0;right:0;height:78px;background:#041513;display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#6fa8a2}
.nav .on{color:#fff}
</style></head><body>
<div class="top"><span>Октябрь</span><span>↺ Отменить</span></div>
<div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i></div>
<div class="mid"><small>Нужды · 55%</small><h1>Нужды</h1><b>62 400<span> ₸</span></b></div>
<div class="meta"><u>−12 800 за неделю</u><u>≈ 2 080/день</u></div>
<div class="rail"><div>+<span>Расход</span></div><div>⇄<span>Перелив</span></div><div>↗<span>Доска</span></div></div>
<div class="next"><span>Далее · Развлечения</span><i>18 900 ₸ ›</i></div>
<div class="nav"><span class="on">Копилки</span><span>Доска</span><span>Долги</span><span>История</span></div>
</body></html>
