<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#120d05 0,#2a1d08 100%);color:#f2ead8;font:500 15px/1.3 'Golos Text',sans-serif;position:relative}
body::before{content:"";position:absolute;left:-40px;right:-40px;top:300px;height:260px;background:radial-gradient(60% 100% at 50% 50%,#d9a21b66,transparent 70%);transform:rotate(-11deg)}
.top{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;font-size:15px;color:#b8a77d}
.tot{position:absolute;top:60px;left:20px;font-size:15px}
.tot small{display:block;color:#b8a77d;text-transform:uppercase;letter-spacing:.1em}
.tot b{display:block;font-weight:800;font-size:15px;margin-top:2px;border-top:2px solid #f2ead8;padding-top:6px}
.slide{position:absolute;left:30px;right:30px;height:92px;transform:skewY(-11deg);background:#2b3a42cc;border:1px solid #f2ead855;box-shadow:0 10px 22px #0008;backdrop-filter:blur(2px)}
.slide>div{transform:skewY(11deg);position:absolute;inset:0;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start}
.slide em{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.slide b{font-weight:800;font-size:15px}
.slide small{display:block;color:#b8c4c9;font-weight:500;font-size:15px;margin-top:4px}
.slide span{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;border:1.5px solid #f2ead8;padding:3px 8px}
.s1{top:200px}.s2{top:292px}.s3{top:384px}.s4{top:476px}
.sav{position:absolute;left:20px;right:20px;bottom:112px;background:#f2ead8;color:#1a1308;padding:12px 16px;display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.nav{position:absolute;bottom:0;left:0;right:0;height:74px;background:#0d0a04;border-top:1px solid #3a2c12;display:flex;justify-content:space-around;align-items:center;font-size:15px;color:#8a7a52}
.nav .on{color:#f2ead8;border-bottom:2px solid #d9a21b;padding-bottom:6px}
.add{position:absolute;right:20px;top:60px;background:#d9482b;color:#fff;font-weight:800;padding:10px 14px}
</style></head><body>
<div class="top"><span>Октябрь</span><span>↺ Отменить</span></div>
<div class="tot"><small>Доступно к тратам</small><b>184 500 ₸</b></div>
<div class="add">+ Расход</div>
<div class="slide s1"><em style="--c:#2f9e7a"></em><div><div><b>Еда</b><small>20% · −3 100 сегодня</small></div><span>79 100</span></div></div>
<div class="slide s2"><em style="--c:#3d5bd9"></em><div><div><b>Нужды</b><small>55% · −12 800 за неделю</small></div><span>62 400</span></div></div>
<div class="slide s3"><em style="--c:#d9482b"></em><div><div><b>Развлечения</b><small>15% · лимит близко</small></div><span>18 900</span></div></div>
<div class="slide s4"><em style="--c:#d9a21b"></em><div><div><b>Транспорт</b><small>10% · +8 000 вчера</small></div><span>24 100</span></div></div>
<div class="sav"><span>Накоплено · подушка</span><span>405 000 ₸</span></div>
<div class="nav"><span class="on">Копилки</span><span>Доска</span><span>Долги</span><span>История</span></div>
</body></html>
