<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#10141c;color:#f3efe6;font:400 14px 'Golos Text',sans-serif;position:relative}
.top{padding:20px 20px 0;display:flex;justify-content:space-between;color:#8d97a8;font-size:12px}
.tot{padding:14px 20px 4px}.tot small{font-size:12px;color:#8d97a8;letter-spacing:.06em}
.tot b{display:block;font:700 40px/1.1 'Unbounded';margin-top:4px;font-variant-numeric:tabular-nums}
.tot b span{color:#f2b134}
.chips{display:flex;gap:8px;padding:6px 20px 14px}
.chips i{font-style:normal;font-size:12px;padding:5px 10px;background:#1b212d;border-radius:999px;color:#c3cad6}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.p{height:150px;border-radius:14px;position:relative;overflow:hidden;background:#1a202b;border:1px solid #262e3c}
.fill{position:absolute;left:0;right:0;bottom:0;background-image:
 linear-gradient(#10141c 1.5px,transparent 1.5px),linear-gradient(90deg,#10141c 1.5px,transparent 1.5px);
 background-size:14px 14px;background-color:var(--c)}
.p .n{position:absolute;left:12px;top:10px;font:600 13px 'Golos Text';text-shadow:0 1px 6px #0008}
.p .v{position:absolute;left:12px;bottom:10px;font:700 17px 'Unbounded';text-shadow:0 1px 8px #0009}
.p .pc{position:absolute;right:10px;top:10px;font-size:11px;background:#10141ccc;padding:2px 7px;border-radius:99px}
.wide{margin:10px 16px 0;height:82px;border-radius:14px;position:relative;overflow:hidden;background:#1a202b;border:1px solid #262e3c}
.wide .fill{top:0;right:auto;width:78%;--c:#4c6ef5}
.wide .n{position:absolute;left:12px;top:10px;font-weight:600;font-size:13px}
.wide .v{position:absolute;left:12px;bottom:10px;font:700 20px 'Unbounded'}
.wide .tag{position:absolute;right:12px;top:10px;font-size:11px;color:#c3cad6}
.nav{position:absolute;bottom:0;left:0;right:0;height:78px;background:#0c1017;border-top:1px solid #222a37;display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#7f8999}
.nav .on{color:#f3efe6;background:#1b212d;padding:8px 16px;border-radius:12px}
.add{position:absolute;right:18px;bottom:92px;background:#e4572e;color:#fff;font:600 14px 'Golos Text';padding:14px 20px;border-radius:16px}
</style></head><body>
<div class="top"><span>Октябрь</span><span>Отменить ↺</span></div>
<div class="tot"><small>Доступно к тратам</small><b>184 500<span> ₸</span></b></div>
<div class="chips"><i>сегодня −4 200</i><i>среднее 6 100/день</i></div>
<div class="panels">
<div class="p" style="--c:#1f8a8a"><div class="fill" style="height:70%"></div><div class="n">Нужды</div><div class="pc">55%</div><div class="v">62 400</div></div>
<div class="p" style="--c:#e4572e"><div class="fill" style="height:28%"></div><div class="n">Развлечения</div><div class="pc">15%</div><div class="v">18 900</div></div>
<div class="p" style="--c:#f2b134"><div class="fill" style="height:45%"></div><div class="n">Транспорт</div><div class="pc">10%</div><div class="v">24 100</div></div>
<div class="p" style="--c:#7a5af8"><div class="fill" style="height:84%"></div><div class="n">Еда</div><div class="pc">20%</div><div class="v">79 100</div></div>
</div>
<div class="wide"><div class="fill"></div><div class="n">Подушка · накоплено</div><div class="tag">не тратится</div><div class="v">405 000 ₸</div></div>
<div class="add">+ Расход</div>
<div class="nav"><span class="on">Копилки</span><span>Доска</span><span>Долги</span><span>История</span></div>
</body></html>
