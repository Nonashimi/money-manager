<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#0e1b3d;color:#14213d;font:500 14px 'Onest',sans-serif;position:relative}
.top{padding:18px 20px 8px;display:flex;justify-content:space-between;color:#9fb0dd;font-size:12px}
.c{margin:0 14px 10px;background:#f4f1ea;border-radius:6px;padding:12px 14px;position:relative;
 -webkit-mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.c small{font:500 10px 'JetBrains Mono';letter-spacing:.1em;text-transform:uppercase;color:#6b7592}
.c b{display:block;font:800 30px/1.1 'Onest';color:#6b4fd0;letter-spacing:-.02em;margin-top:2px}
.c .n{position:absolute;right:14px;top:12px;font-weight:800;color:#14213d;text-align:right}
.c .n i{display:block;font:500 10px 'JetBrains Mono';font-style:normal;color:#6b7592}
.hero{background:#d7263d;color:#fff}.hero small{color:#ffd3d9}.hero b{color:#fff;font-size:44px}
.c.void::after{content:"АННУЛИРОВАНО";position:absolute;right:14px;bottom:10px;border:2px solid #d7263d;color:#d7263d;font:800 12px 'Onest';padding:2px 8px;transform:rotate(-8deg)}
.c.void b{color:#a9a3b8;text-decoration:line-through}
.sav{margin:0 14px;border:1px dashed #6e82c4;border-radius:6px;padding:12px 14px;color:#cfd8f3;display:flex;justify-content:space-between;align-items:center}
.sav b{font:800 20px 'Onest';color:#fff}
.nav{position:absolute;bottom:0;left:0;right:0;height:76px;background:#0a1330;border-top:1px solid #243566;display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#8393c4}
.nav .on{color:#fff;border-bottom:2px solid #d7263d;padding-bottom:6px}
.add{position:absolute;right:18px;bottom:92px;background:#d7263d;color:#fff;font-weight:800;padding:14px 20px;border-radius:6px}
</style></head><body>
<div class="top"><span>Октябрь 2026</span><span>↺ Отменить</span></div>
<div class="c hero"><small>Доступно к тратам</small><b>184 500 ₸</b></div>
<div class="c"><small>Копилка · 55%</small><div class="n">Нужды<i>№ 0042</i></div><b>62 400 ₸</b></div>
<div class="c"><small>Копилка · 15%</small><div class="n">Развлечения<i>№ 0043</i></div><b>18 900 ₸</b></div>
<div class="c"><small>Копилка · 10%</small><div class="n">Транспорт<i>№ 0044</i></div><b>24 100 ₸</b></div>
<div class="c void"><small>Расход · отменён</small><div class="n">Кофе<i>№ 0107</i></div><b>1 800 ₸</b></div>
<div class="sav"><span>Накоплено · подушка</span><b>405 000 ₸</b></div>
<div class="add">+ Расход</div>
<div class="nav"><span class="on">Копилки</span><span>Доска</span><span>Долги</span><span>История</span></div>
</body></html>
