<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#0f1512;color:#e8f0eb;font:400 14px 'Golos Text',sans-serif;position:relative}
.top{padding:20px 20px 0;display:flex;justify-content:space-between;color:#7f9088;font-size:13px}
.sum{margin:14px 16px 0;padding:16px;background:#16221c;border-radius:14px;display:flex;justify-content:space-between;align-items:center}
.sum small{color:#7f9088}.sum b{display:block;font:700 30px 'Golos Text'}
.pill{background:#34c38f22;color:#34c38f;padding:6px 12px;border-radius:99px;font-weight:600;font-size:12px}
.hd{display:grid;grid-template-columns:1fr 70px 76px;padding:18px 20px 8px;font-size:11px;letter-spacing:.08em;color:#6d7f76;text-transform:uppercase}
.row{display:grid;grid-template-columns:1fr 70px 76px;align-items:center;padding:12px 20px;border-top:1px solid #1d2a23}
.row .n{font-weight:600}.row small{display:block;color:#7f9088;font-size:12px}
.bar{height:5px;background:#1d2a23;border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
.row .a{text-align:right;color:#a9b8b0}
.row .b{text-align:right}.row .b span{display:inline-block;background:var(--c);color:#0f1512;font-weight:700;padding:4px 8px;border-radius:99px;font-size:13px}
.sav{margin:10px 16px 0;padding:12px 16px;background:#16221c;border-radius:14px;display:flex;justify-content:space-between}
.nav{position:absolute;bottom:0;left:0;right:0;height:76px;background:#0b100e;border-top:1px solid #1d2a23;display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#6d7f76}
.nav .on{color:#34c38f}
.add{position:absolute;right:18px;bottom:92px;background:#34c38f;color:#0f1512;font-weight:700;padding:14px 20px;border-radius:12px}
</style></head><body>
<div class="top"><span>Октябрь</span><span>Отменить</span></div>
<div class="sum"><div><small>Доступно к тратам</small><b>184 500 ₸</b></div><span class="pill">всё распределено</span></div>
<div class="hd"><span>Копилка</span><span style="text-align:right">Доля</span><span style="text-align:right">Остаток</span></div>
<div class="row" style="--c:#34c38f"><div><div class="n">Нужды</div><div class="bar"><i style="width:72%"></i></div></div><div class="a">55%</div><div class="b"><span>62 400</span></div></div>
<div class="row" style="--c:#f5b83d"><div><div class="n">Развлечения</div><small>лимит близко</small><div class="bar"><i style="width:24%"></i></div></div><div class="a">15%</div><div class="b"><span>18 900</span></div></div>
<div class="row" style="--c:#34c38f"><div><div class="n">Транспорт</div><div class="bar"><i style="width:58%"></i></div></div><div class="a">10%</div><div class="b"><span>24 100</span></div></div>
<div class="row" style="--c:#34c38f"><div><div class="n">Еда</div><div class="bar"><i style="width:88%"></i></div></div><div class="a">20%</div><div class="b"><span>79 100</span></div></div>
<div class="sav"><span>Накоплено · подушка</span><b>405 000 ₸</b></div>
<div class="add">+ Расход</div>
<div class="nav"><span class="on">Копилки</span><span>Доска</span><span>Долги</span><span>История</span></div>
</body></html>
