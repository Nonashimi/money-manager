<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#0b1a33;color:#f1ead6;font:400 14px 'Golos Text',sans-serif;position:relative;
 background-image:radial-gradient(circle at 50% 0,#12305e 0,transparent 60%)}
.top{padding:20px 20px 0;display:flex;justify-content:space-between;color:#8fa4c8;font-size:12px}
.cart{margin:16px 16px 0;padding:3px;border-radius:26px;background:linear-gradient(135deg,#d8a73c,#8a6a1c 50%,#d8a73c)}
.cart div{border-radius:23px;background:#0f2549;padding:18px 18px 16px;text-align:center;border:1px solid #1b6fb0}
.cart small{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#7fd3cb}
.cart b{display:block;font:700 40px/1.15 'Unbounded';margin-top:6px;color:#f1ead6;font-variant-numeric:tabular-nums}
.cart em{font-style:normal;font-size:12px;color:#d8a73c}
.lab{padding:18px 20px 8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8fa4c8}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.t{border-radius:16px;padding:12px;background:var(--c);position:relative;height:112px;box-shadow:inset 0 0 0 3px #0b1a33,inset 0 0 0 4px #d8a73c}
.t .n{font:600 12px 'Golos Text';color:#fff;padding:2px 4px}
.t .v{position:absolute;left:16px;bottom:14px;font:700 19px 'Unbounded';color:#fff;text-shadow:0 1px 6px #0007}
.t .s{position:absolute;right:16px;top:14px;width:20px;height:20px;border:2px solid #fff8;transform:rotate(45deg);border-radius:4px}
.sav{margin:14px 16px 0;border:1px solid #d8a73c;border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#0f2549}
.sav b{font:700 20px 'Unbounded'}.sav small{color:#8fa4c8;font-size:12px}
.nav{position:absolute;bottom:0;left:0;right:0;height:76px;background:#081428;border-top:1px solid #1b3a6b;display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#7f93b8}
.nav .on{color:#d8a73c;border-top:2px solid #d8a73c;padding-top:6px}
.add{position:absolute;right:18px;bottom:92px;background:#d8a73c;color:#0b1a33;font:700 14px 'Golos Text';padding:14px 20px;border-radius:30px}
</style></head><body>
<div class="top"><span>Октябрь</span><span>↺ Отменить</span></div>
<div class="cart"><div><small>Доступно к тратам</small><b>184 500 ₸</b><em>сегодня −4 200 ₸</em></div></div>
<div class="lab">Расходные копилки</div>
<div class="g">
<div class="t" style="--c:#1b6fb0"><span class="s"></span><div class="n">Нужды · 55%</div><div class="v">62 400</div></div>
<div class="t" style="--c:#c9553a"><span class="s"></span><div class="n">Развлечения · 15%</div><div class="v">18 900</div></div>
<div class="t" style="--c:#2bb3a8"><span class="s"></span><div class="n">Транспорт · 10%</div><div class="v">24 100</div></div>
<div class="t" style="--c:#7a5fc4"><span class="s"></span><div class="n">Еда · 20%</div><div class="v">79 100</div></div>
</div>
<div class="sav"><div><small>Накоплено · подушка</small><br><b>405 000 ₸</b></div><small>не тратится</small></div>
<div class="add">+ Расход</div>
<div class="nav"><span class="on">Копилки</span><span>Доска</span><span>Долги</span><span>История</span></div>
</body></html>
