<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#0d0f12;color:#f4f4f0;font:500 14px 'Onest',sans-serif;position:relative}
.top{padding:18px 18px 10px;display:flex;justify-content:space-between;color:#8a909a;font-size:12px}
.band{background:#ffd21f;color:#111;margin:0 12px;padding:14px 16px;border-radius:6px;position:relative}
.band small{font:600 12px 'Onest';letter-spacing:.02em}
.band b{display:block;font:800 60px/1 'Onest';letter-spacing:-.03em;margin-top:2px}
.band .arr{position:absolute;right:16px;top:14px;width:34px;height:34px;background:#111;color:#ffd21f;border-radius:6px;text-align:center;font:800 20px/34px 'Onest'}
.rows{margin:10px 12px 0;display:flex;flex-direction:column;gap:8px}
.r{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:#1a1d23;border-radius:6px;padding:12px 14px;border-left:6px solid var(--c)}
.r i{width:44px;height:44px;background:#f4f4f0;color:#111;border-radius:6px;font:800 18px/44px 'Onest';text-align:center;font-style:normal}
.r span{font-weight:500}.r small{display:block;color:#8a909a;font-size:12px;margin-top:2px}
.r b{font:800 22px 'Onest';letter-spacing:-.02em}
.sav{margin:12px 12px 0;background:#f4f4f0;color:#111;border-radius:6px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.sav b{font:800 22px 'Onest'}.sav small{font-size:12px}
.nav{position:absolute;bottom:0;left:0;right:0;height:74px;background:#ffd21f;color:#111;display:flex;justify-content:space-around;align-items:center;font-weight:800;font-size:13px}
.nav .on{background:#111;color:#ffd21f;padding:8px 14px;border-radius:6px}
.add{position:absolute;right:16px;bottom:90px;background:#111;color:#ffd21f;border:2px solid #ffd21f;padding:12px 18px;border-radius:6px;font-weight:800}
</style></head><body>
<div class="top"><span>Копилки</span><span>↺ Отменить</span></div>
<div class="band"><div class="arr">↓</div><small>Можно потратить</small><b>184 500 ₸</b></div>
<div class="rows">
<div class="r" style="--c:#1fb6a6"><i>Н</i><span>Нужды<small>55% · из дохода</small></span><b>62 400</b></div>
<div class="r" style="--c:#e4572e"><i>Р</i><span>Развлечения<small>лимит близко</small></span><b>18 900</b></div>
<div class="r" style="--c:#4c6ef5"><i>Т</i><span>Транспорт<small>+8 000 вчера</small></span><b>24 100</b></div>
<div class="r" style="--c:#7ac143"><i>Е</i><span>Еда<small>−3 100 сегодня</small></span><b>79 100</b></div>
</div>
<div class="sav"><small>Накоплено · не тратится</small><b>405 000 ₸</b></div>
<div class="add">+ Расход</div>
<div class="nav"><span class="on">Копилки</span><span>Доска</span><span>Долги</span><span>История</span></div>
</body></html>
