<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#14091f;color:#f4f1fa;font:400 14px 'Golos Text',sans-serif;position:relative}
.hero{background:linear-gradient(160deg,#ff5a5f,#7c5cff);padding:22px 20px 26px;border-radius:0 0 30px 30px}
.hero .t{display:flex;justify-content:space-between;font-size:13px;opacity:.9}
.hero small{display:block;margin-top:18px;opacity:.9}.hero b{display:block;font:700 44px/1.1 'Golos Text'}
.hero em{font-style:normal;background:#ffffff33;padding:5px 12px;border-radius:99px;display:inline-block;margin-top:10px;font-size:13px}
.lab{padding:18px 20px 8px;font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.p{background:#211233;border-radius:22px;padding:14px;display:flex;gap:12px;align-items:center}
.r{width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--c) var(--p),#3a2a52 0);display:grid;place-items:center;flex:none}
.r::after{content:"";width:34px;height:34px;border-radius:50%;background:#211233}
.p .n{font-weight:600;font-size:13px}.p b{display:block;font-size:15px;margin-top:2px}
.sav{margin:12px 16px 0;background:#211233;border-radius:22px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.sav b{font-size:18px}.sav small{color:#a99cc2}
.nav{position:absolute;bottom:0;left:0;right:0;height:78px;background:#0f0618;display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#8a7ea4}
.nav .on{color:#2ee6a6}
.add{position:absolute;right:18px;bottom:94px;background:#2ee6a6;color:#14091f;font-weight:700;padding:14px 20px;border-radius:30px}
</style></head><body>
<div class="hero"><div class="t"><span>Октябрь</span><span>Отменить</span></div><small>Доступно к тратам</small><b>184 500 ₸</b><em>6 100 ₸ в день ещё 30 дней</em></div>
<div class="lab">Копилки</div>
<div class="g">
<div class="p"><div class="r" style="--c:#2ee6a6;--p:72%"></div><div><div class="n">Нужды</div><b>62 400</b></div></div>
<div class="p"><div class="r" style="--c:#ff5a5f;--p:24%"></div><div><div class="n">Развлечения</div><b>18 900</b></div></div>
<div class="p"><div class="r" style="--c:#ffb84d;--p:58%"></div><div><div class="n">Транспорт</div><b>24 100</b></div></div>
<div class="p"><div class="r" style="--c:#7c5cff;--p:88%"></div><div><div class="n">Еда</div><b>79 100</b></div></div>
</div>
<div class="sav"><div><small>Накоплено · подушка</small><br><b>405 000 ₸</b></div><small>не тратится</small></div>
<div class="add">+ Расход</div>
<div class="nav"><span class="on">Копилки</span><span>Доска</span><span>Долги</span><span>История</span></div>
</body></html>
