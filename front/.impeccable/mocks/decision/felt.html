<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#14110f;color:#efe6d2;font:500 14px 'Onest',sans-serif;position:relative}
.top{padding:20px 20px 0;display:flex;justify-content:space-between;color:#9c9183;font-size:12px}
.tot{padding:14px 20px 10px}.tot small{font-size:12px;color:#9c9183;letter-spacing:.08em}
.tot b{display:block;font:800 46px/1.05 'Onest';letter-spacing:-.03em;margin-top:4px}
.tot b::after{content:"";display:block;height:10px;margin-top:8px;width:150px;background:
 repeating-linear-gradient(90deg,#b8362b 0 10px,#e8c25a 10px 14px,#2c4a8a 14px 24px,#e8c25a 24px 28px)}
.rug{margin:6px 16px 0;display:flex;flex-direction:column;gap:10px}
.s{height:92px;border-radius:10px;position:relative;overflow:hidden;background:var(--c);padding:12px 14px}
.s::before{content:"";position:absolute;inset:auto 0 0 0;height:30px;opacity:.9;
 background:linear-gradient(135deg,transparent 45%,var(--a) 45% 55%,transparent 55%) 0 0/24px 30px, linear-gradient(225deg,transparent 45%,var(--a) 45% 55%,transparent 55%) 0 0/24px 30px}
.s::after{content:"";position:absolute;inset:0;border:2px dashed #efe6d255;border-radius:10px;margin:5px}
.s .n{font-weight:800;font-size:15px;position:relative}
.s .v{position:absolute;right:16px;top:12px;font:800 22px 'Onest';z-index:1}
.s .p{position:absolute;left:14px;top:34px;font-size:12px;opacity:.85}
.sav{margin:10px 16px 0;height:70px;border-radius:10px;background:#2c4a8a;padding:12px 14px;position:relative;border:2px solid #e8c25a}
.sav small{font-size:12px;opacity:.85}.sav b{display:block;font:800 22px 'Onest'}
.nav{position:absolute;bottom:0;left:0;right:0;height:76px;background:#0d0b0a;border-top:1px solid #2a2420;display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#8a7f72}
.nav .on{color:#e8c25a;border-bottom:2px solid #b8362b;padding-bottom:6px}
.add{position:absolute;right:18px;bottom:92px;background:#b8362b;color:#fff;font-weight:800;padding:14px 20px;border-radius:12px}
</style></head><body>
<div class="top"><span>Октябрь</span><span>↺ Отменить</span></div>
<div class="tot"><small>Доступно к тратам</small><b>184 500 ₸</b></div>
<div class="rug">
<div class="s" style="--c:#b8362b;--a:#e8c25a"><div class="n">Нужды</div><div class="p">55% дохода</div><div class="v">62 400</div></div>
<div class="s" style="--c:#2c4a8a;--a:#efe6d2"><div class="n">Развлечения</div><div class="p">15% дохода</div><div class="v">18 900</div></div>
<div class="s" style="--c:#7a6a2a;--a:#14110f"><div class="n">Транспорт</div><div class="p">10% дохода</div><div class="v">24 100</div></div>
<div class="s" style="--c:#2f6b5a;--a:#e8c25a"><div class="n">Еда</div><div class="p">20% дохода</div><div class="v">79 100</div></div>
</div>
<div class="sav"><small>Накоплено · подушка · не тратится</small><b>405 000 ₸</b></div>
<div class="add">+ Расход</div>
<div class="nav"><span class="on">Копилки</span><span>Доска</span><span>Долги</span><span>История</span></div>
</body></html>
