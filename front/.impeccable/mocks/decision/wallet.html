<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#0b0b0f;color:#f2f2f7;font:400 14px 'Golos Text',sans-serif;position:relative}
.top{padding:20px 20px 0;display:flex;justify-content:space-between;color:#8e8e99;font-size:13px}
.tot{padding:12px 20px}.tot small{color:#8e8e99}.tot b{display:block;font:700 40px 'Golos Text';margin-top:2px}
.stack{margin:0 16px;position:relative;height:430px}
.k{position:absolute;left:0;right:0;height:170px;border-radius:22px;padding:16px 18px;box-shadow:0 -6px 18px #0009;background:var(--c)}
.k .n{font-weight:700;font-size:16px}.k .p{font-size:12px;opacity:.8}
.k .v{position:absolute;left:18px;bottom:16px;font:700 28px 'Golos Text'}
.k .ic{position:absolute;right:18px;top:16px;width:32px;height:32px;border-radius:50%;background:#fff3}
.sav{margin:12px 16px 0;background:#1c1c24;border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.sav b{font:700 18px 'Golos Text'}.sav small{color:#8e8e99;font-size:12px}
.nav{position:absolute;bottom:0;left:0;right:0;height:80px;background:#121218;border-top:1px solid #23232c;display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#7c7c88}
.nav .on{color:#5e5ce6}
.add{position:absolute;right:18px;bottom:96px;background:#5e5ce6;color:#fff;font-weight:700;padding:14px 20px;border-radius:30px}
</style></head><body>
<div class="top"><span>Октябрь</span><span>Отменить</span></div>
<div class="tot"><small>Доступно к тратам</small><b>184 500 ₸</b></div>
<div class="stack">
<div class="k" style="top:0;--c:#2f6df6"><div class="n">Нужды</div><div class="p">55% дохода</div><div class="ic"></div><div class="v">62 400 ₸</div></div>
<div class="k" style="top:54px;--c:#ff9f0a"><div class="n">Развлечения</div><div class="p">15% дохода</div><div class="ic"></div><div class="v">18 900 ₸</div></div>
<div class="k" style="top:108px;--c:#30b05c"><div class="n">Транспорт</div><div class="p">10% дохода</div><div class="ic"></div><div class="v">24 100 ₸</div></div>
<div class="k" style="top:162px;--c:#8e5cf0;height:230px"><div class="n">Еда</div><div class="p">20% дохода · −3 100 сегодня</div><div class="ic"></div><div class="v">79 100 ₸</div></div>
</div>
<div class="sav"><div><small>Накоплено · подушка</small><br><b>405 000 ₸</b></div><small>не тратится</small></div>
<div class="add">+ Расход</div>
<div class="nav"><span class="on">Копилки</span><span>Доска</span><span>Долги</span><span>История</span></div>
</body></html>
