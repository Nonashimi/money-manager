<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#0b0d12;color:#e6e8ee;font:400 14px 'Golos Text',sans-serif;position:relative}
.top{padding:20px 20px 0;display:flex;justify-content:space-between;color:#8a90a2;font-size:13px}
.tot{margin:14px 16px 0;padding:18px;background:linear-gradient(160deg,#1a1d29,#12141c);border:1px solid #23273a;border-radius:18px}
.tot small{color:#8a90a2}.tot b{display:block;font:700 36px 'Golos Text';margin-top:6px}
.tot em{font-style:normal;font-size:12px;color:#6ee7a8;background:#6ee7a822;padding:3px 8px;border-radius:99px;margin-top:8px;display:inline-block}
.list{margin:14px 16px 0;display:flex;flex-direction:column;gap:10px}
.k{background:#12141c;border:1px solid #23273a;border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.k div span{display:flex;align-items:center;gap:8px;font-weight:600}.k i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.k small{color:#8a90a2;font-size:12px}.k b{font-size:18px}
.nav{position:absolute;bottom:0;left:0;right:0;height:76px;background:#0b0d12;border-top:1px solid #1d2030;display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#6d7388}
.nav .on{color:#818cf8}
</style></head><body>
<div class="top"><span>Октябрь 2026</span><span>Отменить</span></div>
<div class="tot"><small>Доступно к тратам</small><b>184 500 ₸</b><em>+12 300 за неделю</em></div>
<div class="list">
<div class="k" style="--c:#14b8a6"><div><span><i></i>Нужды</span><small>55%</small></div><b>62 400 ₸</b></div>
<div class="k" style="--c:#f97316"><div><span><i></i>Развлечения</span><small>15%</small></div><b>18 900 ₸</b></div>
<div class="k" style="--c:#818cf8"><div><span><i></i>Транспорт</span><small>10%</small></div><b>24 100 ₸</b></div>
<div class="k" style="--c:#a3e635"><div><span><i></i>Еда</span><small>20%</small></div><b>79 100 ₸</b></div>
<div class="k" style="--c:#64748b"><div><span><i></i>Подушка</span><small>накоплено</small></div><b>405 000 ₸</b></div>
</div>
<div class="nav"><span class="on">Копилки</span><span>Доска</span><span>Долги</span><span>История</span></div>
</body></html>
