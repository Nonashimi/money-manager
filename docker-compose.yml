# Local sandbox: Postgres + NestJS API + Nuxt front, all with hot reload.
#   docker compose up          -> front http://localhost:3002, API http://localhost:3000/api
#   docker compose down        -> stop (data is kept in the `pgdata` volume)
#   docker compose down -v     -> stop and wipe the database and node_modules volumes
#
# Postgres is published on host port 5434 so it doesn't clash with a local Postgres on 5432.
# Sources are bind-mounted, but node_modules live in named volumes (container has Linux binaries,
# the host has macOS ones).

x-node: &node
  image: node:22-bookworm-slim
  working_dir: /app
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - back_node_modules:/app/back/node_modules
    - front_node_modules:/app/front/node_modules
    - front_nuxt:/app/front/.nuxt

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: money_manager
      POSTGRES_PASSWORD: money_manager
      POSTGRES_DB: money_manager
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money_manager -d money_manager"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: installs dependencies (and runs `prisma generate` / `nuxt prepare` via postinstall)
  # into the shared volumes, so back and front don't race on the same node_modules.
  install:
    <<: *node
    command: >
      sh -c 'apt-get update -qq && apt-get install -y -qq openssl ca-certificates >/dev/null &&
      if [ ! -f node_modules/.installed ] || [ package-lock.json -nt node_modules/.installed ]; then
        npm ci --no-audit --no-fund && touch node_modules/.installed;
      else
        echo "dependencies up to date";
      fi'

  back:
    <<: *node
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://money_manager:money_manager@db:5432/money_manager?schema=public
      DIRECT_URL: postgresql://money_manager:money_manager@db:5432/money_manager?schema=public
      JWT_SECRET: local-dev-secret
      JWT_EXPIRES_IN: 7d
      PORT: "3000"
      CORS_ORIGIN: http://localhost:3002
    ports:
      - "3000:3000"
    command: sh -c 'cd back && npx prisma migrate deploy && npm run start:dev'

  front:
    <<: *node
    depends_on:
      install:
        condition: service_completed_successfully
      back:
        condition: service_started
    environment:
      # The browser talks to the API via localhost:3000; server-side rendering inside this
      # container must use the compose service name instead.
      NUXT_PUBLIC_API_BASE: http://localhost:3000
      NUXT_API_BASE_SERVER: http://back:3000
    ports:
      - "3002:3002"
    command: sh -c 'cd front && npx nuxt dev --host 0.0.0.0 --port 3002'

volumes:
  pgdata:
  node_modules:
  back_node_modules:
  front_node_modules:
  front_nuxt:
